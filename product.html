<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GotiTech Product</title>
<style>
:root{--bg:#070b13;--card:#111925;--line:#2b3749;--text:#f3f6fb;--muted:#aab5c7;--cyan:#25d7e8;--blue:#2876df;--danger:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102642 0,#070b13 42%,#05070b 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:rgba(7,11,19,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:26px;font-weight:900}.brand span{color:var(--cyan)}.back{border:1px solid var(--line);background:#111925;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}
.wrap{max-width:1180px;margin:35px auto;padding:0 20px}.product{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;background:rgba(17,25,37,.92);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 20px 60px #0008}.imagebox{min-height:470px;border-radius:18px;background:#09111c;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.imagebox img{width:100%;height:100%;max-height:520px;object-fit:contain}.emoji{font-size:140px}.tag{position:absolute;top:16px;left:16px;background:#ff6b6b;color:#fff;padding:7px 12px;border-radius:999px;font-weight:800}
.cat{color:var(--cyan);font-weight:700}.name{font-size:clamp(28px,5vw,48px);line-height:1.08;margin:10px 0}.stars{color:#ffc84d}.price{font-size:34px;font-weight:900;color:var(--cyan);margin:20px 0}.old{font-size:18px;color:#8c96a5;text-decoration:line-through;margin-left:10px}.desc{color:var(--muted);line-height:1.7;font-size:16px}.actions{display:flex;gap:12px;margin:26px 0;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:15px 20px;font-size:16px;font-weight:800;cursor:pointer}.cart{background:#172335;color:#fff;border:1px solid var(--line);flex:1}.buy{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;flex:1}
.checkout{margin-top:24px;background:rgba(17,25,37,.95);border:1px solid var(--line);border-radius:18px;padding:22px;display:none}.checkout.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:flex;flex-direction:column;gap:7px;color:#cbd4e2;font-size:14px;font-weight:700}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #334154;background:#0a1019;color:#fff;font:inherit}textarea{min-height:100px;resize:vertical}.location{display:flex;gap:10px;align-items:end}.location button{white-space:nowrap;background:#1b2d42;color:#fff;border:1px solid #3b526d;padding:13px;border-radius:10px;cursor:pointer}
.delivery{margin-top:16px;padding:14px;border-radius:12px;background:#0b1420;border:1px solid #29405a}.summary{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}.row{display:flex;justify-content:space-between;margin:8px 0}.total{font-size:22px;font-weight:900;color:var(--cyan)}.place{width:100%;margin-top:16px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(100px);background:#172335;border:1px solid #3b526d;padding:12px 18px;border-radius:12px;transition:.25s;z-index:10}.toast.show{transform:translateX(-50%) translateY(0)}
.empty{max-width:700px;margin:80px auto;text-align:center;padding:30px;background:#111925;border:1px solid var(--line);border-radius:20px}
@media(max-width:780px){.product{grid-template-columns:1fr;padding:14px}.imagebox{min-height:330px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.location{flex-direction:column;align-items:stretch}.location button{width:100%}.wrap{margin-top:18px}.nav{padding:12px 14px}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.thumb{width:68px;height:68px;border:1px solid #2c3a4d;background:#111923;border-radius:10px;padding:3px;cursor:pointer}.thumb.active{border-color:#28b8d8}.thumb img{width:100%;height:100%;object-fit:cover;border-radius:7px}
</style>
</head>
<body>
<header class="top"><div class="nav"><a class="brand" href="index.html"><span>Goti</span>Tech</a><button class="back" onclick="history.length>1?history.back():location.href='index.html'">← Back to shop</button></div></header>
<main class="wrap" id="app"></main><div class="toast" id="toast"></div>
<script>
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
const defaultProducts=[
{name:"Smart AMOLED Watch Pro",cat:"Gadgets",price:7900,old:9900,icon:"⌚",sale:true,desc:"Premium AMOLED smart watch."},{name:"Wireless Noise-Canceling Earbuds",cat:"Audio & Video",price:5900,old:7900,icon:"🎧",sale:true,desc:"Immersive wireless audio."},{name:"MagSafe Fast Wireless Charger",cat:"Gadgets",price:3900,old:4900,icon:"◉",sale:false,desc:"Fast wireless charging."},{name:"Smart Power Adapter 65W",cat:"Gadgets",price:3500,old:4500,icon:"🔌",sale:false,desc:"Compact fast charger."},{name:"Countertop Stainless Steel Oven",cat:"Kitchen Appliances",price:55900,old:59900,icon:"♨️",sale:true,desc:"Modern countertop oven."},{name:"Smart Sensor Microwave Oven",cat:"Kitchen Appliances",price:50900,old:52900,icon:"▣",sale:true,desc:"Smart sensor microwave."},{name:"Double Door Mini Fridge",cat:"Home Appliances",price:47900,old:null,icon:"🧊",sale:false,desc:"Compact refrigerator."},{name:"36-inch Side-by-Side Refrigerator",cat:"Home Appliances",price:74900,old:79900,icon:"▥",sale:true,desc:"Spacious side-by-side refrigerator."},{name:"UltraBook 14 Laptop",cat:"PCs & Laptop",price:89900,old:99900,icon:"💻",sale:true,desc:"Slim everyday laptop."},{name:"4K Smart TV 55-inch",cat:"Audio & Video",price:64900,old:72900,icon:"📺",sale:true,desc:"Crisp 4K smart TV."},{name:"Portable Bluetooth Speaker",cat:"Audio & Video",price:6900,old:8900,icon:"🔊",sale:false,desc:"Portable rich-sound speaker."},{name:"Smart Home Hub",cat:"Smart Home",price:9900,old:12900,icon:"◈",sale:true,desc:"Connected smart-home hub."}];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let products=[], cart=[], selected=null, delivery=120, detectedArea='outside';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2400)}
function selectProductImage(src,btn){const m=document.getElementById('mainProductImage');if(m)m.src=src.trim();document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function save(){localStorage.setItem('gotitech_cart',JSON.stringify(cart));localStorage.setItem('gotitech_products',JSON.stringify(products))}
function load(){try{products=JSON.parse(localStorage.getItem('gotitech_products')||'null')||defaultProducts}catch(e){products=defaultProducts}if(!localStorage.getItem('gotitech_products'))localStorage.setItem('gotitech_products',JSON.stringify(products));try{cart=JSON.parse(localStorage.getItem('gotitech_cart')||'[]')}catch(e){cart=[]}
const rawId=new URLSearchParams(location.search).get('id');let id=products.findIndex(p=>String(p._id||'')===String(rawId));if(id<0){const numeric=Number(rawId);if(Number.isInteger(numeric)&&numeric>=0&&products[numeric])id=numeric}if(id<0){document.getElementById('app').innerHTML='<div class="empty"><h1>Product not found</h1><p>The product may have been deleted or the link is invalid.</p><a class="btn buy" href="index.html">Go to shop</a></div>';return}selected={...products[id],index:id};render()}
function render(){const p=selected;const imgs=(Array.isArray(p.images)&&p.images.length?p.images:(p.image?[p.image]:[]));const image=imgs.length?`<img id="mainProductImage" src="${esc(imgs[0])}" alt="${esc(p.name)}" onerror="this.remove();this.parentElement.insertAdjacentHTML('beforeend','<div class=emoji>'+esc(p.icon||'📦')+'</div>')">`:`<div class="emoji">${esc(p.icon||'📦')}</div>`;const thumbs=imgs.length>1?`<div class="thumbs">${imgs.map((src,n)=>`<button type="button" class="thumb ${n===0?'active':''}" onclick="selectProductImage('${String(src).replace(/'/g,"\\'")}',this)"><img src="${esc(src)}" alt="${n+1}"></button>`).join('')}</div>`:'';
document.getElementById('app').innerHTML=`<section class="product"><div><div class="imagebox">${p.sale?'<span class="tag">SALE</span>':''}${image}</div>${thumbs}</div><div><div class="cat">${esc(p.cat||'GotiTech')}</div><h1 class="name">${esc(p.name)}</h1><div class="stars">★★★★★ <span style="color:#9ba7b8">4.9 rating</span></div><div class="price">${money(p.price)}${p.old?`<span class="old">${money(p.old)}</span>`:''}</div><p class="desc">${esc(p.desc||'Quality GotiTech product with reliable features and modern design.')}</p><div class="actions"><button class="btn cart" onclick="addToCart()">🛒 Add to cart</button><button class="btn buy" onclick="openBuy()">⚡ Buy now</button></div><div id="checkout" class="checkout"><h2>Complete your order</h2><div class="grid"><label>Full name<input id="name" required placeholder="Your name"></label><label>Phone number<input id="phone" required placeholder="01XXXXXXXXX"></label><label class="full">Delivery location<div class="location"><input id="locationText" readonly placeholder="Tap Add location to choose your division & district"><button type="button" onclick="openLocationPage()">📍 Add location</button></div></label><label class="full">Full delivery address<textarea id="address" placeholder="House, road, area, thana, district"></textarea></label></div><div class="delivery" id="deliveryBox">Delivery charge: checking location…</div><div class="summary"><div class="row"><span>Product</span><b>${money(p.price)}</b></div><div class="row"><span>Delivery</span><b id="deliveryPrice">৳120</b></div><div class="row total"><span>Total</span><b id="totalPrice">${money(p.price+120)}</b></div></div><button class="btn place" onclick="placeOrder()">Place order — Cash on Delivery</button></div></div></section>`;updateDeliveryUI()}
function addToCart(){cart.push({...products[selected.index]});save();toast('Added to cart ✓')}
function openBuy(){const box=document.getElementById('checkout');box.classList.add('show');box.scrollIntoView({behavior:'smooth',block:'center'});loadSavedLocation()}
function openLocationPage(){localStorage.setItem('gotitech_location_return','product.html?id='+selected.index);location.href='location.html?id='+selected.index}
function loadSavedLocation(){const raw=localStorage.getItem('gotitech_delivery_location');if(!raw)return;try{const loc=JSON.parse(raw);if(!loc||!loc.district)return;detectedArea=loc.area||'outside';delivery=selected.price>=5000?0:(detectedArea==='dhaka'?60:120);const input=document.getElementById('locationText');if(input)input.value=[loc.division,loc.district].filter(Boolean).join(', ');updateDeliveryUI();const box=document.getElementById('deliveryBox');if(box)box.innerHTML=delivery===0?'🚚 <b>Free Delivery</b> for orders of ৳5,000 or more':'📍 <b>'+ (detectedArea==='dhaka'?'Inside Dhaka':'Outside Dhaka') +'</b> — delivery '+money(delivery)}catch(e){console.warn(e)}}
function placeOrder(){
  const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),locationText=document.getElementById('locationText').value.trim();
  const raw=localStorage.getItem('gotitech_delivery_location');let loc=null;try{loc=raw?JSON.parse(raw):null}catch(e){}
  if(!name||!phone||!address||!locationText||!loc||!loc.district){toast('Please add your delivery location first');return}
  if(!/^(?:\+?8801|01)[3-9]\d{8}$/.test(phone)){toast('Enter a valid Bangladesh phone number');return}
  const d=selected.price>=5000?0:delivery;
  const orders=JSON.parse(localStorage.getItem('gotitech_orders')||'[]');
  orders.unshift({
    id:'GT'+Date.now().toString().slice(-8),name,phone,address,
    division:loc.division||'',district:loc.district||'',locationText:[loc.division,loc.district].filter(Boolean).join(', '),
    area:loc.area||detectedArea,delivery:d,subtotal:selected.price,total:selected.price+d,
    method:'Cash on Delivery',items:[{productId:selected._id||'',listingNo:selected.listingNo||'',name:selected.name,price:selected.price,quantity:1}],createdAt:new Date().toLocaleString('en-BD')
  });
  localStorage.setItem('gotitech_orders',JSON.stringify(orders));toast('Order placed successfully ✓');setTimeout(()=>location.href='index.html',1100)
}
load();
</script>
</body></html>
