<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Shipping Address • GotiTech</title><style>
:root{--bg:#080d14;--card:#121a26;--line:#2a3a50;--text:#edf3fb;--muted:#9aa8bb;--blue:#28b7df;--orange:#ff8b24}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070c14,#0d1420);color:var(--text);font-family:Arial,sans-serif}.top{position:sticky;top:0;background:#101722;border-bottom:1px solid var(--line);padding:15px;display:flex;align-items:center;gap:14px;z-index:2}.back{border:0;background:transparent;color:#fff;font-size:25px;cursor:pointer}.title{font-size:18px;font-weight:800}.wrap{max-width:620px;margin:auto;padding:18px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:#c9d4e3}.input,.pick,textarea{width:100%;border:1px solid var(--line);background:#182231;color:#fff;border-radius:11px;padding:15px;font:inherit}.pick{display:flex;justify-content:space-between;align-items:center;cursor:pointer}.muted{color:var(--muted)}textarea{min-height:110px;resize:vertical}.save{width:100%;margin-top:24px;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:800;background:linear-gradient(90deg,#22bad8,#2478df);color:white;cursor:pointer}.note{font-size:13px;color:#8da0b5;line-height:1.5}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}.sheet.show{display:flex}.panel{width:100%;max-width:700px;margin:auto;background:#fff;color:#16202e;border-radius:22px 22px 0 0;max-height:82vh;overflow:auto}.sheethead{position:sticky;top:0;background:#fff;padding:18px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd;font-weight:800}.close{border:0;background:transparent;font-size:24px}.option{padding:17px 18px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;cursor:pointer}.option:active{background:#f1f5f8}.small{font-size:12px;color:#6b7787}
</style></head><body><header class="top"><button class="back" onclick="goBack()">‹</button><div class="title">Add Shipping Address</div></header><main class="wrap"><div class="field"><label>Recipient's Name *</label><input id="name" class="input" placeholder="Enter your name"></div><div class="field"><label>Phone Number *</label><input id="phone" class="input" placeholder="01XXXXXXXXX"></div><div class="field"><label>Region / City / District *</label><div class="pick" onclick="openDivisions()"><span id="locationLabel" class="muted">Select your location</span><span>›</span></div></div><div class="field"><label>Address *</label><textarea id="address" placeholder="House, road, area, thana, village, etc."></textarea></div><p class="note">Delivery charge will be selected automatically: <b>Inside Dhaka ৳60</b> and <b>Outside Dhaka ৳120</b>. Orders ৳5,000 or more get free delivery.</p><button class="save" onclick="saveAddress()">Save address</button></main><div class="sheet" id="sheet"><div class="panel"><div class="sheethead"><span id="sheetTitle">Select address</span><button class="close" onclick="closeSheet()">×</button></div><div id="list"></div></div></div><script>
const divisions={Barishal:['Barguna','Barishal','Bhola','Jhalokathi','Patuakhali','Pirojpur'],Chattogram:['Bandarban','Brahmanbaria','Chandpur','Chattogram','Cumilla','Cox’s Bazar','Feni','Khagrachhari','Lakshmipur','Noakhali','Rangamati'],Dhaka:['Dhaka','Faridpur','Gazipur','Gopalganj','Kishoreganj','Madaripur','Manikganj','Munshiganj','Narayanganj','Narsingdi','Rajbari','Shariatpur','Tangail'],Khulna:['Bagerhat','Chuadanga','Jashore','Jhenaidah','Khulna','Kushtia','Magura','Meherpur','Narail','Satkhira'],Mymensingh:['Jamalpur','Mymensingh','Netrokona','Sherpur'],Rajshahi:['Bogura','Joypurhat','Naogaon','Natore','Chapainawabganj','Pabna','Rajshahi','Sirajganj'],Rangpur:['Dinajpur','Gaibandha','Kurigram','Lalmonirhat','Nilphamari','Panchagarh','Rangpur','Thakurgaon'],Sylhet:['Habiganj','Moulvibazar','Sunamganj','Sylhet']};let division='',district='';
function openSheet(title,items,click){document.getElementById('sheetTitle').textContent=title;document.getElementById('list').innerHTML=items.map(x=>'<div class="option" onclick="'+click.replace('{x}',x.replace(/'/g,"\\'"))+'"><span>'+x+'</span><span>›</span></div>').join('');document.getElementById('sheet').classList.add('show')}
function openDivisions(){openSheet('Select Region',Object.keys(divisions),"chooseDivision('{x}')")}
function chooseDivision(x){division=x;openSheet('Select District',divisions[x],"chooseDistrict('{x}')")}
function chooseDistrict(x){district=x;document.getElementById('locationLabel').textContent=division+', '+district;document.getElementById('locationLabel').classList.remove('muted');closeSheet()}
function closeSheet(){document.getElementById('sheet').classList.remove('show')}
function goBack(){location.href=localStorage.getItem('gotitech_location_return')||'index.html'}
function saveAddress(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();if(!name||!phone||!address||!district){alert('Please complete all required fields and select your location.');return}if(!/^(?:\\+?8801|01)[3-9]\\d{8}$/.test(phone)){alert('Please enter a valid Bangladesh phone number.');return}const area=(division==='Dhaka'&&district==='Dhaka')?'dhaka':'outside';localStorage.setItem('gotitech_delivery_location',JSON.stringify({name,phone,address,division,district,area}));const back=localStorage.getItem('gotitech_location_return')||'index.html';location.href=back}
try{const old=JSON.parse(localStorage.getItem('gotitech_delivery_location')||'null');if(old){name.value=old.name||'';phone.value=old.phone||'';address.value=old.address||'';division=old.division||'';district=old.district||'';if(district){locationLabel.textContent=division+', '+district;locationLabel.classList.remove('muted')}}}catch(e){}
</script></body></html>
