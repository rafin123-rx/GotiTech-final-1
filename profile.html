<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Account • GotiTech</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6fa;color:#172033}.top{background:#101827;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.brand span{color:#35d0ba}.back{color:#fff;text-decoration:none;border:1px solid #455064;padding:9px 14px;border-radius:10px}.wrap{max-width:900px;margin:35px auto;padding:0 18px}.hero{background:linear-gradient(135deg,#101827,#22324f);color:#fff;border-radius:24px;padding:30px;display:flex;gap:22px;align-items:center;box-shadow:0 15px 40px #0002}.avatar{width:94px;height:94px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#e9eef6}.avatarFallback{display:flex;align-items:center;justify-content:center;font-size:40px}.muted{opacity:.78}.email{font-size:16px;word-break:break-all}.card{background:#fff;border-radius:20px;padding:24px;margin-top:22px;box-shadow:0 8px 25px #17203312}.ordersBtn{width:100%;border:0;border-radius:16px;padding:18px;background:#101827;color:#fff;font-size:17px;font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px}.ordersBtn .ico{font-size:28px;background:#ffffff1c;border-radius:12px;padding:8px 10px}.orders{display:none;margin-top:18px}.order{border:1px solid #e4e8ef;border-radius:15px;padding:16px;margin:12px 0;background:#fbfcfe}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{background:#eaf8f5;color:#087968;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}.items{margin:10px 0;padding:10px 0;border-top:1px solid #eee;border-bottom:1px solid #eee}.location{color:#5b6575;line-height:1.55}.empty{text-align:center;padding:35px;color:#667085}.logout{margin-top:22px;width:100%;border:0;border-radius:14px;padding:15px;background:#e5484d;color:#fff;font-size:16px;font-weight:700;cursor:pointer}@media(max-width:600px){.hero{padding:22px}.wrap{margin:20px auto}.avatar{width:78px;height:78px}}
</style></head><body><header class="top"><div class="brand"><span>Goti</span>Tech</div><a class="back" href="index.html">← Back to shop</a></header><main class="wrap"><section class="hero"><img id="avatar" class="avatar" alt="Profile"><div><h1 id="name">My Account</h1><div class="muted">Customer Account</div><p id="email" class="email"></p></div></section><section class="card"><button class="ordersBtn" onclick="toggleOrders()"><span class="ico">🛍️</span><span><span style="display:block">My Orders</span><small style="font-weight:400;opacity:.75">See products and delivery addresses</small></span><span id="arrow" style="margin-left:auto;font-size:24px">⌄</span></button><div id="orders" class="orders"></div><button class="logout" onclick="logout()">↪ Log out</button></section></main><script>
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function user(){try{const g=JSON.parse(localStorage.getItem('gotitech_google_user')||'null');if(g&&(g.email||g.name))return g}catch(e){}const x=localStorage.getItem('gotitech_user');return x?{name:x.split('@')[0],email:x,picture:''}:null}const u=user();if(!u)location.replace('index.html');document.getElementById('name').textContent=u.name||'GotiTech Customer';document.getElementById('email').textContent=u.email||'';const av=document.getElementById('avatar');if(u.picture)av.src=u.picture;else{av.style.display='none';const d=document.createElement('div');d.className='avatar avatarFallback';d.textContent='👤';av.replaceWith(d)}function renderOrders(){const email=(u.email||'').toLowerCase(),phone=String(u.phone||'').replace(/\D/g,'');const all=JSON.parse(localStorage.getItem('gotitech_orders')||'[]');const mine=all.filter(o=>(email&&o.customerEmail&&o.customerEmail.toLowerCase()===email)||(phone&&String(o.phone||'').replace(/\D/g,'')===phone));const box=document.getElementById('orders');if(!mine.length){box.innerHTML='<div class="empty">📦 No orders found for this account yet.</div>';return}box.innerHTML=mine.map(o=>`<article class="order"><div class="head"><div><b>Order ${esc(o.id)}</b><div style="font-size:13px;color:#667085;margin-top:4px">${esc(o.createdAt||'')}</div></div><span class="tag">Cash on Delivery</span></div><div class="items">${(o.items||[]).map(i=>`<div style="margin:7px 0"><b>${esc(i.name)}</b>${i.listingNo?` <small style="color:#667085">(${esc(i.listingNo)})</small>`:''}<br><small>Qty: ${Number(i.quantity||1)} • ৳${Number(i.price||0).toLocaleString('en-BD')}</small></div>`).join('')}</div><div class="location"><b>📍 Delivery location</b><br>${esc([o.division,o.district].filter(Boolean).join(', ')||o.locationText||'Not available')}<br>${esc(o.address||'')}</div><div style="margin-top:10px;font-weight:800">Total: ৳${Number(o.total||0).toLocaleString('en-BD')}</div></article>`).join('')}function toggleOrders(){const b=document.getElementById('orders'),a=document.getElementById('arrow');const open=b.style.display==='block';b.style.display=open?'none':'block';a.textContent=open?'⌄':'⌃'}function logout(){localStorage.removeItem('gotitech_google_user');localStorage.removeItem('gotitech_customer_user');localStorage.removeItem('gotitech_user');location.href='index.html'}renderOrders();
</script></body></html>
